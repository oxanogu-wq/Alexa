<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ALEXA HOSTING</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: #05060b;
            color: white;
            overflow: hidden;
        }

        /* =========================
           RGB BACKGROUND
        ========================== */

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0,255,255,.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(255,0,170,.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(100,0,255,.15),
                    transparent 35%
                ),
                #05060b;
            z-index: -5;
        }

        .grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(0,255,255,.055) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,0,170,.055) 1px,
                    transparent 1px
                );
            background-size: 42px 42px;
            opacity: .35;
            mask-image: linear-gradient(
                to bottom,
                black,
                transparent
            );
            z-index: -4;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .045;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 3px,
                white 4px
            );
            z-index: -3;
        }

        /* =========================
           FLOATING RGB ORBS
        ========================== */

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .18;
            z-index: -2;
            pointer-events: none;
            animation: floatOrb 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 220px;
            height: 220px;
            background: #00ffff;
            left: -100px;
            top: 10%;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: #ff00aa;
            right: -110px;
            bottom: 10%;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 180px;
            height: 180px;
            background: #743cff;
            left: 45%;
            top: -100px;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translate(0,0);
            }

            50% {
                transform: translate(25px,-30px);
            }
        }

        /* =========================
           MAIN LOGIN CARD
        ========================== */

        .login-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 2px;
            border-radius: 25px;

            background: conic-gradient(
                from 0deg,
                #00ffff,
                #0066ff,
                #7c3aed,
                #ff00aa,
                #ff0066,
                #00ffff
            );

            animation: rgbBorder 5s linear infinite;

            box-shadow:
                0 0 30px rgba(0,255,255,.12),
                0 0 60px rgba(255,0,170,.08);
        }

        @keyframes rgbBorder {
            to {
                filter: hue-rotate(360deg);
            }
        }

        .login-card {
            position: relative;
            border-radius: 23px;
            background: rgba(9,11,18,.94);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 32px;
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            position: relative;
            width: 82px;
            height: 82px;
            margin: auto;
            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #00cfff,
                    #2563eb,
                    #7c3aed,
                    #ec4899
                );

            box-shadow:
                0 0 25px rgba(0,255,255,.25),
                0 0 45px rgba(255,0,170,.12);

            overflow: hidden;
        }

        .logo::after {
            content: "";
            position: absolute;
            width: 70%;
            height: 180%;
            top: -40%;
            left: -100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.45),
                transparent
            );

            transform: rotate(25deg);
            animation: logoShine 3s infinite;
        }

        @keyframes logoShine {
            0% {
                left: -100%;
            }

            45%,100% {
                left: 150%;
            }
        }

        .logo i {
            position: relative;
            z-index: 2;
            font-size: 36px;
        }

        /* =========================
           RGB TEXT
        ========================== */

        .rgb-text {
            background: linear-gradient(
                90deg,
                #00ffff,
                #3b82f6,
                #8b5cf6,
                #ff00aa,
                #00ffff
            );

            background-size: 300% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: rgbText 4s linear infinite;
        }

        @keyframes rgbText {
            to {
                background-position: 300% center;
            }
        }

        /* =========================
           STATUS
        ========================== */

        .online {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 5px 11px;

            border-radius: 999px;

            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;

            color: #67e8f9;

            background: rgba(0,255,255,.06);
            border: 1px solid rgba(0,255,255,.2);
        }

        .online-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #22d3ee;

            box-shadow:
                0 0 10px #22d3ee;

            animation: onlinePulse 1.5s infinite;
        }

        @keyframes onlinePulse {
            0%,100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .4;
                transform: scale(.65);
            }
        }

        /* =========================
           INPUT
        ========================== */

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #64748b;

            transition: .3s;
            pointer-events: none;
        }

        .input-field {
            width: 100%;

            background: rgba(5,7,13,.9);

            border: 1px solid rgba(255,255,255,.09);

            border-radius: 12px;

            padding: 13px 15px 13px 44px;

            color: white;

            outline: none;

            transition: .3s;
        }

        .input-field::placeholder {
            color: #4b5563;
        }

        .input-field:focus {
            border-color: rgba(0,255,255,.55);

            box-shadow:
                0 0 0 3px rgba(0,255,255,.05),
                0 0 20px rgba(0,255,255,.08);
        }

        .input-field:focus + .input-icon {
            color: #22d3ee;
        }

        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-button {
            position: relative;

            width: 100%;

            border: 0;
            border-radius: 12px;

            padding: 14px;

            color: white;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #0891b2,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            background-size: 250% 100%;

            animation: buttonRGB 5s linear infinite;

            box-shadow:
                0 0 20px rgba(37,99,235,.2);

            transition: .3s;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 25px rgba(0,255,255,.22),
                0 0 45px rgba(255,0,170,.12);
        }

        .login-button:active {
            transform: scale(.98);
        }

        @keyframes buttonRGB {
            to {
                background-position: 250% 0;
            }
        }

        /* =========================
           ERROR
        ========================== */

        .error-box {
            background: rgba(239,68,68,.08);

            border: 1px solid rgba(239,68,68,.4);

            color: #fca5a5;

            border-radius: 12px;

            padding: 11px 13px;

            font-size: 12px;

            animation: errorIn .35s ease;
        }

        @keyframes errorIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           FOOTER SECURITY
        ========================== */

        .security {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            color: #4b5563;

            font-size: 9px;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .security i {
            color: #22c55e;
        }

        /* =========================
           CORNER DECORATION
        ========================== */

        .corner {
            position: absolute;
            width: 35px;
            height: 35px;
            pointer-events: none;
        }

        .corner-tl {
            top: 12px;
            left: 12px;
            border-top: 1px solid #22d3ee;
            border-left: 1px solid #22d3ee;
        }

        .corner-br {
            bottom: 12px;
            right: 12px;
            border-bottom: 1px solid #ec4899;
            border-right: 1px solid #ec4899;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .login-card {
                padding: 25px 20px;
            }

            .logo {
                width: 72px;
                height: 72px;
            }

            .logo i {
                font-size: 30px;
            }

            .login-wrapper {
                border-radius: 22px;
            }

            .login-card {
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="grid"></div>
    <div class="scanlines"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>


    <!-- =========================
         LOGIN
    ========================== -->

    <main class="min-h-screen flex items-center justify-center p-4">

        <div class="login-wrapper">

            <div class="login-card">

                <div class="corner corner-tl"></div>
                <div class="corner corner-br"></div>


                <!-- HEADER -->

                <div class="text-center mb-8">

                    <div class="logo mb-5">

                        <i class="fas fa-cloud-upload-alt"></i>

                    </div>


                    <h1 class="text-3xl md:text-4xl
                               font-black tracking-tight">

                        ALEXA

                        <span class="rgb-text">
                            HOSTING
                        </span>

                    </h1>


                    <p class="text-gray-500 text-xs mt-2">
                        Premium Hosting Solution
                    </p>


                    <div class="mt-4">

                        <span class="online">

                            <span class="online-dot"></span>

                            SYSTEM ONLINE

                        </span>

                    </div>

                </div>


                <!-- ERROR -->

                {% if error %}

                <div class="error-box mb-5">

                    <i class="fas fa-triangle-exclamation mr-2"></i>

                    {{ error }}

                </div>

                {% endif %}


                <!-- LOGIN FORM -->

                <form method="POST">

                    <!-- USERNAME -->

                    <div class="mb-5">

                        <label class="block text-gray-400
                                      text-xs font-semibold
                                      mb-2">

                            Username

                        </label>

                        <div class="input-group">

                            <input
                                type="text"
                                name="username"
                                required
                                autocomplete="username"
                                placeholder="Enter username"
                                class="input-field"
                            >

                            <i class="fas fa-user input-icon"></i>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-6">

                        <label class="block text-gray-400
                                      text-xs font-semibold
                                      mb-2">

                            Password

                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                name="password"
                                required
                                autocomplete="current-password"
                                placeholder="Enter password"
                                class="input-field"
                            >

                            <i class="fas fa-lock input-icon"></i>

                        </div>

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-button">

                        <i class="fas fa-right-to-bracket mr-2"></i>

                        LOGIN TO PANEL

                    </button>

                </form>


                <!-- SECURITY -->

                <div class="mt-7">

                    <div class="security">

                        <i class="fas fa-shield-halved"></i>

                        Secure Access Only

                    </div>

                    <div class="text-center
                                text-[8px]
                                text-gray-700
                                mt-2
                                tracking-[2px]">

                        ALEXA CORE • AUTHENTICATION SYSTEM

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script>

        // Small focus animation
        const inputs = document.querySelectorAll(".input-field");

        inputs.forEach(input => {

            input.addEventListener("focus", () => {
                input.parentElement.style.transform = "translateY(-1px)";
            });

            input.addEventListener("blur", () => {
                input.parentElement.style.transform = "translateY(0)";
            });

        });

    </script>

</body>
</html>
